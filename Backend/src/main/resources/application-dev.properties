# Carga Backend/.env (formato KEY=VALUE) como fuente de propiedades, ANTES de que
# se resuelva cualquier otro placeholder (a diferencia del viejo DotenvConfig,
# que se inicializaba demasiado tarde y nunca llegaba a tiempo para el datasource).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5434/shiftmanager
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
server.port=8080