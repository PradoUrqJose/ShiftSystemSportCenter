spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Mantener pequeño el pool por instancia evita agotar las conexiones de
# Supabase cuando Cloud Run escala horizontalmente.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# El plan gratuito usa un contenedor pequeño. Un límite de hilos acotado
# evita reservar memoria para una concurrencia que 0.1 vCPU no puede atender.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:30}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:2}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}

# La documentación interactiva queda disponible en desarrollo. Desactivarla
# en el contenedor pequeño reduce beans y memoria sin afectar los endpoints.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
server.port=${PORT:8080}
