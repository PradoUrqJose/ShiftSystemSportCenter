spring.application.name=shift-manager

# En local carga Backend/.env. En el hosting las mismas claves se inyectan como
# variables de entorno; el archivo es opcional y nunca forma parte de la imagen.
spring.config.import=optional:file:.env[.properties]

spring.jpa.show-sql=false

# Sin esto, Hibernate mantiene abierta la conexión del pool durante toda la
# serialización JSON de la respuesta (Open Session In View, default true en
# Spring Boot). Bajo carga esto puede agotar el pool de conexiones. Los lazy
# loads que dependían de esto ahora se resuelven explícitamente con
# @EntityGraph en los repositorios (ver TurnoRepository, ColaboradorRepository).
spring.jpa.open-in-view=false

# El esquema ya no lo gestiona Hibernate (antes ddl-auto=update podía alterar
# tablas en cada arranque sin revisión); ahora lo versiona Flyway en
# src/main/resources/db/migration y Hibernate solo valida que las entidades
# coincidan con lo que Flyway creó.
spring.jpa.hibernate.ddl-auto=validate

# baseline-on-migrate: en una base que ya tiene el esquema (dev local, prod)
# pero nunca corrió Flyway, la marca como "ya en la versión 1" sin ejecutar
# V1__baseline.sql (que solo corre de verdad en una base nueva y vacía).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
# Desarrollo es el perfil por defecto, pero SPRING_PROFILES_ACTIVE=prod lo
# reemplaza limpiamente en producción (active=dev impedía esa separación).
spring.profiles.default=dev

# Orígenes autorizados separados por coma. El hosting podrá reemplazarlos con
# CORS_ALLOWED_ORIGINS sin recompilar el backend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5000,https://turnos.sportcenterpe.com}

# Autenticación (Etapa 1 - JWT mínimo). Mismo nombre de variable en dev (via
# Backend/.env) y en producción (variable de entorno real en el hosting).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
