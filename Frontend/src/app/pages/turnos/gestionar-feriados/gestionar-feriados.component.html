<div class="p-6 rounded-lg min-h-screen w-11/12 mx-auto">
  <!-- Contenedor principal -->
  <div class="flex flex-wrap items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-gray-800 sm:mr-6 border-b-2 border-blue-400 pb-1">Gestión de Feriados</h2>
    <div class="flex space-x-4">
      <button (click)="abrirModalAgregarFeriado()"
        class="buttonStyle blue-button font-bold py-2 px-3 rounded-lg transition transform hover:scale-105">
        Agregar
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 border border-red-400 ">
    {{ errorMessage }}
  </div>
  <div class="mt-6">
    <app-table-shell>
      <table class="w-full">
        <thead>
          <tr class="bg-paper text-ink">
            <th class="p-4 text-left font-bold">Fecha</th>
            <th class="p-4 text-left font-bold">Descripción</th>
            <th class="p-4 text-center font-bold"><i class="fa-solid fa-gear"></i></th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngIf="!isLoading; else feriadosSkeleton">
            <tr *ngFor="let feriado of feriados; trackBy: trackByFeriadoId" class="border-t border-line-soft hover:bg-paper transition">
              <td class="p-4">{{ feriado.fecha }}</td>
              <td class="p-4">{{ feriado.descripcion || 'Sin descripción' }}</td>
              <td class="p-4 flex justify-center items-center space-x-2">
                <button (click)="editarFeriado(feriado)" class="text-blue-600 hover:text-blue-800 transition">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button (click)="eliminarFeriado(feriado.id)" class="text-red-600 hover:text-red-800 transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="feriados.length === 0">
              <td colspan="3" class="p-4 text-center text-ink-faint">No hay feriados registrados.</td>
            </tr>
          </ng-container>
          <ng-template #feriadosSkeleton>
            <tr *ngFor="let _ of skeletonRows">
              <td class="p-4"><app-skeleton width="40%"></app-skeleton></td>
              <td class="p-4"><app-skeleton width="70%"></app-skeleton></td>
              <td class="p-4 flex justify-center gap-2">
                <app-skeleton width="18px" height="18px" shape="circle"></app-skeleton>
                <app-skeleton width="18px" height="18px" shape="circle"></app-skeleton>
              </td>
            </tr>
          </ng-template>
        </tbody>
      </table>
    </app-table-shell>
  </div>

  <!-- Modal de agregar/editar feriado -->
  <app-agregar-feriado-modal
    [mostrarModal]="mostrarModalAgregarFeriado"
    [isModalVisible]="isModalAgregarFeriadoVisible"
    [feriadoActual]="feriadoActual"
    (cerrarModalEvent)="cerrarModalAgregarFeriado()"
    (feriadoGuardado)="onFeriadoGuardado($event)">
  </app-agregar-feriado-modal>
</div>
