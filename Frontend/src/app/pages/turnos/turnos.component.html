<div class="px-6 pr-3 py-4 w-full min-h-screen flex flex-col">

    <div class="p-4 mb-3">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <!-- Navegación (izquierda) -->
      <div class="flex flex-wrap items-center gap-4">
        <app-header [vistaMensual]="calendario.vistaMensual" [nombreMesActual]="calendario.nombreMesActual"
            (cambiarVista)="toggleVistaMensual($event)" (cambiarSemanaOMes)="cambiarSemanaOMesHandler($event)">
          </app-header>
          <!-- Acciones de turnos: separadas de la navegación por un divisor,
               solo ícono siempre (no solo en pantallas chicas) para que la
               fila completa entre en una laptop de 14" sin que nada salte de
               línea. El título hace de tooltip. -->
          <div class="toolbar-divider"></div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button type="button" *ngIf="!calendario.vistaMensual"
              class="icon-action hue-teal disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="copiandoSemana"
              (click)="copiarSemanaAnterior()"
              data-tooltip="Copiar semana anterior" aria-label="Copiar semana anterior">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path d="M4 16V6a2 2 0 0 1 2-2h10" />
              </svg>
            </button>
            <button type="button"
              class="icon-action hue-violet"
              (click)="abrirModalTurnosMasivos()"
              data-tooltip="Turnos masivos" aria-label="Turnos masivos">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="3.2" />
                <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" />
                <path d="M16 8.2a3 3 0 1 1 3.2 3" />
                <path d="M21.5 20c0-2.8-1.8-4.9-4.3-5.7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Filtros (derecha) -->
        <div class="z-50 flex flex-wrap items-center gap-3">
          <app-filter-bar [companies]="empresasFromList((colaboradores$ | async) || [])"
            [collaborators]="(colaboradores$ | async) || []" [selectedCompany]="selectedCompanyForMonthly"
            [selectedCollaboratorIds]="colaboradoresSeleccionadosSemana"
            (companyChange)="onMonthlyCompanyChange($event)"
            (collaboratorChange)="onMonthlyCollaboratorChange($event)"></app-filter-bar>
        </div>
      </div>
    </div>

    <!-- Button para Turnos Estritos -->
    <!-- <a routerLink="/reportes/semana-normal"
      class="cursor-pointer buttonStyle blue-button font-bold py-2 px-3 rounded-md transition transform hover:scale-105">
      Semana Normal
    </a> -->

  <!-- Skeleton de carga: grilla-fantasma con la forma real de cada vista
       (reemplaza el spinner .sk-circle genérico) — misma condición
       calendario.isLoading$ que ya controlaba el spinner, no se toca
       TurnosCalendarService. La ghost-table semanal se extrajo a
       app-weekly-schedule-skeleton (Fase 4) porque semana-normal.component
       necesitaba exactamente la misma. -->
  <app-weekly-schedule-skeleton *ngIf="!calendario.vistaMensual && (calendario.isLoading$ | async)">
  </app-weekly-schedule-skeleton>

  <div *ngIf="calendario.vistaMensual && (calendario.isLoading$ | async)"
    class="flex flex-col sm:flex-row gap-3" aria-hidden="true">
    <div class="w-[24%] flex flex-col gap-2">
      <app-skeleton *ngFor="let _ of skeletonRows" width="100%" height="40px" radius="10px"></app-skeleton>
    </div>
    <div class="w-full sm:w-[76%] grid grid-cols-7 gap-2">
      <app-skeleton *ngFor="let _ of skeletonMonthCells" width="100%" height="8rem" radius="10px"></app-skeleton>
    </div>
  </div>

  <!-- Tabla de turnos semanal -->
  <div *ngIf="!calendario.vistaMensual && !(calendario.isLoading$ | async)" class="table-wrapper">
    <app-weekly-view [diasSemana]="(calendario.diasSemana$ | async) || []" [colaboradores]="(colaboradores$ | async) || []"
      [turnos]="(calendario.turnos$ | async) || []" [externalCompanyFilter]="selectedCompanyForMonthly"
       [externalCollaboratorFilter]="colaboradoresSeleccionadosSemana"
      (abrirModal)="abrirModal($event.colaboradorId, $event.fecha)" (abrirModalEdicion)="abrirModalEdicion($event)">
    </app-weekly-view>
  </div>

  <!-- Contenedor principal para las tablas -->
  <div class="flex flex-col sm:flex-row gap-3 space-y-6 sm:space-y-0" *ngIf="calendario.vistaMensual && !(calendario.isLoading$ | async)">
    <!-- Tabla de selección de colaborador -->
    <div class="w-[24%]">
      <div *ngIf="calendario.colaboradorSeleccionado === 0" class="text-red-500 text-sm py-4 text-center">
        * Seleccione un colaborador
      </div>
      <table class="w-full shadow bg-transparent rounded-lg overflow-hidden bg-white">
        <thead>
          <tr class="bg-blue-50 text-gray-800">
            <th class="text-center p-3">Colaborador</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let colaborador of colaboradoresFiltrados$ | async; trackBy: trackByColaboradorId" class="hover:bg-gray-50 transition">
            <td class="py-4 px-4 flex justify-start items-center gap-3 w-full"
              [ngClass]="{'bg-blue-100 text-blue-800 font-bold': colaborador.id === calendario.colaboradorSeleccionado}">
              <button (click)="calendario.mostrarTurnosMensuales(colaborador.id)"
                class="flex justify-start items-center w-full gap-3 transition">
                <div class="photo flex items-center justify-center w-10 h-10 rounded-full bg-gray-200 overflow-hidden">
                  <img [src]="colaborador.fotoUrl || 'assets/user-circle-svgrepo-com.svg'"
                    alt="Foto de {{ colaborador.nombre }}" class="w-full h-full object-cover" />
                </div>
                <div class="text-left">
                  <div class="colaborador-nombre text-sm font-bold">
                    {{ colaborador.nombre | primeraPalabra }} {{ colaborador.apellido | primeraPalabra }}
                  </div>
                  <div class="colaborador-empresa inline-block text-gray-700 font-bold">
                    {{ colaborador.empresaNombre }}
                  </div>
                </div>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Tabla de turnos mensual -->
    <div class="w-full sm:w-[76%]">
      <app-monthly-view [semanasDelMes]="calendario.semanasDelMes" [colaboradorSeleccionado]="calendario.colaboradorSeleccionado"
        [turnosMensuales$]="calendario.turnosMensuales$" [diasSemana]="(calendario.diasSemana$ | async) || []" [mes]="calendario.mes" [anio]="calendario.anio"
        (abrirModal)="abrirModal($event.colaboradorId, $event.fecha)" (abrirModalEdicion)="abrirModalEdicion($event)"
        (turnosModificados)="calendario.actualizarResumenMensual()"></app-monthly-view>
    </div>
  </div>

  <!-- Modal para Turnos -->
  <app-turno-modal [mostrarModal]="(mostrarModal$ | async) === true"
    [isModalVisible]="(isModalVisible$ | async) === true" [turnoActual]="turnoActual" [turnoOriginal]="turnoOriginal"
    [tiendas$]="tiendas$" (cerrarModalEvent)="cerrarModal()" (turnoGuardado)="manejarTurnoGuardado()"
    (turnoEliminado)="manejarTurnoEliminado()">
  </app-turno-modal>

  <!-- Modal para Turnos Masivos -->
  <app-turnos-masivos-modal [mostrarModal]="mostrarModalTurnosMasivos" [isModalVisible]="isModalTurnosMasivosVisible"
    [colaboradores]="(colaboradores$ | async) || []" [tiendas]="(tiendas$ | async) || []"
    (cerrarModalEvent)="cerrarModalTurnosMasivos()" (turnosCreados)="manejarTurnosMasivosCreados()">
  </app-turnos-masivos-modal>
