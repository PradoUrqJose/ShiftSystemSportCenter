<div class="flex flex-wrap items-center justify-between w-full">
  <!-- Título de la vista actual (semana/mes) -->
  <h2 class="text-2xl font-bold text-ink sm:mr-6 border-b-2 border-brand pb-2 sm:hidden hidden">
    {{ vistaMensual ? 'Turnos Mensuales' : 'Turnos Semanales' }}
  </h2>

  <div class="flex gap-2 flex-wrap items-center justify-between">
    <!-- Botones de cambio de vista (semana/mes): variant sigue el estado
    activo directo (primary = seleccionado, secondary = el otro) en vez
    de necesitar una clase "active" propia del Button. -->
    @if (opcionMes) {
      <div class="flex gap-2">
        <app-button [variant]="!vistaMensual ? 'primary' : 'secondary'" (click)="toggleVistaMensual('week')">
          Semana
        </app-button>
        <app-button [variant]="vistaMensual ? 'primary' : 'secondary'" (click)="toggleVistaMensual('month')">
          Mes
        </app-button>
      </div>
    }

    <!-- Navegación entre semanas/meses -->
    <div class="flex gap-2 items-center">
      <app-button variant="icon" hue="neutral" ariaLabel="Anterior" (click)="cambiarSemanaOMesHandler('anterior')">
        <i class="fa-solid fa-angle-left"></i>
      </app-button>

      <!-- Nombre del mes actual -->
      <div class="text-ink text-sm font-bold py-3">
        {{ nombreMesActual }}
      </div>

      <app-button variant="icon" hue="neutral" ariaLabel="Siguiente" (click)="cambiarSemanaOMesHandler('siguiente')">
        <i class="fa-solid fa-angle-right"></i>
      </app-button>
    </div>
  </div>
</div>
