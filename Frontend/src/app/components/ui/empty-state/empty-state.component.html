<div class="app-empty-state">
  @if (icon) {
    <div class="app-empty-state__icon" aria-hidden="true">{{ icon }}</div>
  }
  <p class="app-empty-state__title">{{ title }}</p>
  @if (description) {
    <p class="app-empty-state__desc">{{ description }}</p>
  }
  <div class="app-empty-state__action">
    <ng-content></ng-content>
  </div>
</div>
