<div class="table-wrapper" aria-hidden="true">
  <table class="w-full shadow bg-white rounded-lg">
    <thead>
      <tr>
        <th class="bg-blue-50 px-2 py-4 w-[100%]">
          <app-skeleton width="90px" height="12px"></app-skeleton>
        </th>
        @for (_ of colsArray; track $index) {
          <th class="bg-blue-50 px-2 py-4">
            <app-skeleton width="32px" height="32px" shape="circle"></app-skeleton>
          </th>
        }
        <th class="bg-blue-50 px-2 py-4 w-[6%]"></th>
      </tr>
    </thead>
    <tbody>
      @for (_ of rowsArray; track $index) {
        <tr>
          <td class="py-4 px-4">
            <div class="flex items-center gap-3">
              <app-skeleton width="48px" height="48px" shape="circle"></app-skeleton>
              <div class="flex flex-col gap-2 flex-1">
                <app-skeleton width="70%" height="12px"></app-skeleton>
                <app-skeleton width="40%" height="10px"></app-skeleton>
              </div>
            </div>
          </td>
          @for (_ of colsArray; track $index) {
            <td class="text-center px-2">
              <app-skeleton width="90%" height="46px" radius="10px"></app-skeleton>
            </td>
          }
          <td></td>
        </tr>
      }
    </tbody>
  </table>
</div>
