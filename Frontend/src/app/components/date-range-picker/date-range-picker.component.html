<div class="relative">
  <button type="button"
    class="w-full flex items-center justify-between gap-2 p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition text-left bg-white"
    (click)="toggle($event)">
    <span [ngClass]="(inicio && fin) ? 'text-gray-800 font-medium' : 'text-gray-400'" class="capitalize">{{ etiqueta }}</span>
    <i class="fa-regular fa-calendar text-gray-400"></i>
  </button>

  <div *ngIf="open"
    class="absolute top-full left-0 mt-1 w-72 bg-white border border-gray-200 rounded-lg shadow-lg z-50 p-3"
    (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-2">
      <button type="button" class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-500" (click)="mesAnterior()">
        <i class="fa-solid fa-angle-left"></i>
      </button>
      <span class="text-sm font-semibold text-gray-700 capitalize">{{ nombreMes }}</span>
      <button type="button" class="w-7 h-7 rounded-lg hover:bg-gray-100 text-gray-500" (click)="mesSiguiente()">
        <i class="fa-solid fa-angle-right"></i>
      </button>
    </div>

    <div class="grid grid-cols-7 gap-0.5 mb-1">
      <span *ngFor="let d of diasSemana" class="text-center text-[10px] font-bold text-gray-400 pb-1">{{ d }}</span>
    </div>
    <div class="grid grid-cols-7 gap-0.5">
      <button *ngFor="let celda of celdas; trackBy: trackByFecha" type="button"
        class="aspect-square text-xs rounded-md transition"
        [ngClass]="{
          'text-gray-300': celda.fueraDeMes,
          'text-gray-700 hover:bg-blue-50': !celda.fueraDeMes && !esInicio(celda.fecha) && !esFin(celda.fecha),
          'bg-blue-100': enRango(celda.fecha),
          'bg-blue-500 text-white font-bold': esInicio(celda.fecha) || esFin(celda.fecha)
        }"
        (click)="seleccionarDia(celda.fecha)">
        {{ celda.fecha.getDate() }}
      </button>
    </div>

    <div class="flex flex-wrap gap-2 mt-3 pt-3 border-t border-gray-100">
      <button type="button" class="text-xs font-semibold text-blue-500 hover:text-blue-700 bg-gray-50 hover:bg-blue-50 rounded-md px-2 py-1 transition"
        (click)="aplicarPreset('semana')">Esta semana</button>
      <button type="button" class="text-xs font-semibold text-blue-500 hover:text-blue-700 bg-gray-50 hover:bg-blue-50 rounded-md px-2 py-1 transition"
        (click)="aplicarPreset('proximaSemana')">Próxima semana</button>
      <button type="button" class="text-xs font-semibold text-blue-500 hover:text-blue-700 bg-gray-50 hover:bg-blue-50 rounded-md px-2 py-1 transition"
        (click)="aplicarPreset('mes')">Este mes</button>
    </div>
  </div>
</div>
