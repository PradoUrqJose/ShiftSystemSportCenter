<div *ngIf="filtros.errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 border border-red-400">
  {{ filtros.errorMessage }}
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4 mb-8 items-end bg-paper p-4 rounded-lg border border-line-soft">
  <!-- 📅 Fecha Inicio -->
  <div class="flex flex-col">
    <label class="text-sm font-medium text-ink-soft mb-1 flex items-center gap-1">
      <i class="fa-regular fa-calendar"></i> Fecha Inicio
    </label>
    <input
      type="date"
      [(ngModel)]="filtros.fechaInicio"
      class="h-10 w-full border border-line rounded-md px-3 text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none transition"
    />
  </div>

  <!-- 📅 Fecha Fin -->
  <div class="flex flex-col">
    <label class="text-sm font-medium text-ink-soft mb-1 flex items-center gap-1">
      <i class="fa-regular fa-calendar-check"></i> Fecha Fin
    </label>
    <input
      type="date"
      [(ngModel)]="filtros.fechaFin"
      class="h-10 w-full border border-line rounded-md px-3 text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none transition"
    />
  </div>

  <!-- 🏢 Empresa -->
  <div class="flex flex-col">
    <label class="text-sm font-medium text-ink-soft mb-1 flex items-center gap-1">
      <i class="fa-solid fa-building"></i> Empresa
    </label>
    <select
      [(ngModel)]="filtros.empresaSeleccionada"
      (change)="filtros.onEmpresaChange()"
      class="h-10 w-full border border-line rounded-md px-3 text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none transition"
    >
      <option [ngValue]="'all'">Todas las empresas</option>
      <option *ngFor="let e of filtros.empresas; trackBy: filtros.trackByEmpresaId" [ngValue]="e.id" [disabled]="e.id === -1">
        {{ e.nombre }}
      </option>
    </select>
  </div>

  <!-- 🔘 Estado -->
  <div class="flex flex-col">
    <label class="text-sm font-medium text-ink-soft mb-1 flex items-center gap-1">
      <i class="fa-solid fa-toggle-on"></i> Estado
    </label>
    <select
      [(ngModel)]="filtros.estadoSeleccionado"
      (change)="filtros.onEstadoChange()"
      class="h-10 w-full border border-line rounded-md px-3 text-sm focus:ring-2 focus:ring-brand focus:border-brand outline-none transition"
    >
      <option [ngValue]="'all'">Todos</option>
      <option [ngValue]="true">Habilitado</option>
      <option [ngValue]="false">Inactivo</option>
    </select>
  </div>

  <!-- 👤 Colaboradores -->
  <div class="lg:col-span-2 flex flex-col">
    <label class="text-sm font-medium text-ink-soft mb-1 flex items-center gap-1">
      <i class="fa-solid fa-user"></i> Seleccionar Colaboradores
    </label>
    <ng-select
      class="custom-ng-select h-10 w-full"
      [items]="filtros.colaboradores"
      bindLabel="nombre"
      bindValue="id"
      [(ngModel)]="filtros.colaboradoresSeleccionados"
      [closeOnSelect]="false"
      [multiple]="true"
      [clearable]="true"
      placeholder="Selecciona colaboradores"
    >
      <ng-template ng-option-tmp let-item="item">
        <div class="flex items-center justify-between w-full">
          <div class="flex items-center">
            <input
              type="checkbox"
              [checked]="filtros.colaboradoresSeleccionados.includes(item.id)"
              (change)="filtros.toggleSelection(item.id)"
              class="mr-2 w-4 h-4 text-brand border-gray-300 rounded focus:ring-brand"
            />
            <div class="flex flex-col">
              <span class="custom-option">{{ item.nombre }} {{ item.apellido }}</span>
              <span class="text-xs text-ink-faint">{{ item.empresaNombre }}</span>
            </div>
          </div>
          <span
            class="text-xs font-semibold"
            [ngClass]="{
              'text-green-600': item.habilitado,
              'text-red-600': !item.habilitado
            }"
            >{{ item.habilitado ? 'Habilitado' : 'Inactivo' }}</span
          >
        </div>
      </ng-template>
    </ng-select>
  </div>

  <!-- 🔍 Acciones -->
  <div class="flex justify-end items-end gap-2">
    <app-button variant="primary" [isLoading]="buscando" (click)="buscar.emit()">
      <i class="fa-solid fa-magnifying-glass text-sm"></i>
      Buscar
    </app-button>
    <ng-content select="[toolbar-extra]"></ng-content>
  </div>
</div>
