<div class="filter-container">
  <div class="flex flex-wrap gap-2.5 items-center">
    <button *ngIf="showSortControl" (click)="onToggleSort()"
      class="pill" [class.is-active]="sortActive">
      <i class="fa-solid fa-sort text-xs pill-icon"></i>
      <span class="hidden sm:inline">Ordenar</span>
    </button>

    <!-- Filtro por Empresa -->
    <div class="relative">
      <button type="button" class="pill" [class.is-active]="selectedCompany && selectedCompany !== 'all'"
        (click)="openCompanyDropdown($event)">
        <i class="fa-solid fa-building text-xs pill-icon"></i>
        <span>{{ getSelectedEmpresaName() }}</span>
        <i class="fa-solid fa-chevron-down pill-chevron" [class.rotate-180]="showCompanyDropdown"></i>
      </button>

      <div *ngIf="showCompanyDropdown" class="panel w-64 dropdown-anim" (click)="$event.stopPropagation()">
        <p class="panel-title">Empresa</p>
        <div class="panel-body">
          <button *ngFor="let empresa of companies; trackBy: trackByCompany" class="option-row"
            [class.selected]="(!selectedCompany || selectedCompany === 'all') && empresa === 'all' || selectedCompany === empresa"
            (click)="selectCompany(empresa)">
            <span class="option-label">{{ empresa === 'all' ? 'Todas las empresas' : empresa }}</span>
            <i class="fa-solid fa-check option-check"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Filtro por Colaboradores -->
    <div class="relative">
      <button type="button" class="pill" [class.is-active]="selectedCollaboratorIds && selectedCollaboratorIds.length > 0"
        (click)="openCollaboratorDropdown($event)">
        <i class="fa-solid fa-users text-xs pill-icon"></i>
        <span>{{ getSelectedColaboradorName() }}</span>
        <i class="fa-solid fa-chevron-down pill-chevron" [class.rotate-180]="showCollaboratorDropdown"></i>
      </button>

      <div *ngIf="showCollaboratorDropdown" class="panel panel-right w-80 dropdown-anim" (click)="$event.stopPropagation()">
        <div class="panel-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" [(ngModel)]="collaboratorSearch" placeholder="Buscar colaboradores…">
        </div>
        <div class="panel-body panel-body-scroll">
          <button class="option-row" [class.selected]="!selectedCollaboratorIds || selectedCollaboratorIds.length === 0"
            (click)="selectAllCollaborators()">
            <span class="option-label">Todos los colaboradores</span>
            <i class="fa-solid fa-check option-check"></i>
          </button>

          <div class="panel-divider"></div>

          <button *ngFor="let c of filteredCollaborators; trackBy: trackByColaboradorId" class="option-row option-row-person"
            [class.selected]="(selectedCollaboratorIds || []).includes(c.id)"
            (click)="toggleCollaborator(c.id)">
            <span class="option-avatar">{{ iniciales(c) }}</span>
            <span class="option-label option-label-person">
              <span class="option-name">{{ c.nombre }} {{ c.apellido }}</span>
              <span class="option-sub">{{ c.empresaNombre }}</span>
            </span>
            <i class="fa-solid fa-check option-check"></i>
          </button>

          <div *ngIf="filteredCollaborators.length === 0" class="panel-empty">
            No se encontraron colaboradores
          </div>
        </div>
      </div>
    </div>

    <!-- Limpiar: solo aparece si hay algo que limpiar -->
    <button *ngIf="hasActiveFilters" type="button" class="link-clear" (click)="clearAll()">
      Limpiar filtros
    </button>
  </div>
</div>
